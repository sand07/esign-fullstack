# Nginx Configuration untuk Docker Environment

upstream esign_backend {
    server app:3999;
}

server {
    listen 80;
    server_name localhost;

    # Logs
    access_log /var/log/nginx/esign-access.log;
    error_log /var/log/nginx/esign-error.log;

    # Client settings
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Timeout
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Main application
    location /esign {
        proxy_pass http://esign_backend/esign;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # Next.js static files
    location /_next/static {
        proxy_pass http://esign_backend/_next/static;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Root redirect
    location = / {
        return 301 /esign;
    }
}
