# Nginx Configuration untuk E-Sign Application
#
# Instalasi:
# 1. Copy file ini ke /etc/nginx/sites-available/esign
#    sudo cp deployment/nginx.conf /etc/nginx/sites-available/esign
#
# 2. Edit dan sesuaikan dengan domain Anda
#    sudo nano /etc/nginx/sites-available/esign
#
# 3. Buat symbolic link ke sites-enabled
#    sudo ln -s /etc/nginx/sites-available/esign /etc/nginx/sites-enabled/
#
# 4. Test konfigurasi
#    sudo nginx -t
#
# 5. Reload Nginx
#    sudo systemctl reload nginx

# Redirect HTTP ke HTTPS (uncomment setelah SSL terpasang)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name your-domain.com www.your-domain.com;
#     return 301 https://$server_name$request_uri;
# }

# HTTP Server (comment setelah SSL terpasang)
server {
    listen 80;
    listen [::]:80;

    # GANTI dengan domain Anda
    server_name your-domain.com www.your-domain.com;

    # Access and error logs
    access_log /var/log/nginx/esign-access.log;
    error_log /var/log/nginx/esign-error.log;

    # Client body size untuk upload file
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Timeout settings
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;

    # Main application location
    location /esign {
        # Proxy ke Next.js application
        proxy_pass http://localhost:3999/esign;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Disable buffering untuk real-time
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }

    # Next.js static files dengan caching
    location /_next/static {
        proxy_pass http://localhost:3999/_next/static;

        # Cache static files agresif
        add_header Cache-Control "public, max-age=31536000, immutable";

        # CORS headers (jika diperlukan)
        # add_header Access-Control-Allow-Origin "*";
    }

    # Next.js image optimization
    location /_next/image {
        proxy_pass http://localhost:3999/_next/image;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache images
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Favicon dan robots.txt
    location = /favicon.ico {
        proxy_pass http://localhost:3999/favicon.ico;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        proxy_pass http://localhost:3999/robots.txt;
        access_log off;
        log_not_found off;
    }

    # Deny access ke sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}

