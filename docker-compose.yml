# Docker Compose untuk E-Sign Application
# Deploy dengan: docker-compose up -d
# Stop dengan: docker-compose down
# Logs dengan: docker-compose logs -f

version: '3.8'

services:
  # ================================
  # PostgreSQL Database
  # ================================
  postgres:
    image: postgres:15-alpine
    container_name: esign-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: esign
      POSTGRES_PASSWORD: ${DB_PASSWORD:-esign_password_change_me}
      POSTGRES_DB: esign_production
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - esign-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esign"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================
  # MinIO Object Storage (Optional)
  # ================================
  minio:
    image: minio/minio:latest
    container_name: esign-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - esign-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ================================
  # E-Sign Application
  # ================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esign-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://esign:${DB_PASSWORD:-esign_password_change_me}@postgres:5432/esign_production

      # NextAuth
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3999}
      NEXT_PUBLIC_NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3999}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-this-to-random-secret-minimum-32-characters}
      SECRET: ${SECRET:-change-this-to-random-secret-minimum-32-characters}

      # Base Path
      BASE_PATH: /esign

      # Node
      NODE_ENV: production
      PORT: 3999

      # MinIO (optional)
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000

      # OAuth (kosongkan untuk standalone)
      MASTER_ID: ${MASTER_ID:-}
      MASTER_SECRET: ${MASTER_SECRET:-}
      MASTER_WELLKNOWN: ${MASTER_WELLKNOWN:-}
      MASTER_SCOPE: ${MASTER_SCOPE:-}
      API_GATEWAY: ${API_GATEWAY:-}

    ports:
      - "3999:3999"
    volumes:
      # Mount logs untuk persistence
      - ./logs:/app/logs
    networks:
      - esign-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3999/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ================================
  # Nginx Reverse Proxy (Optional)
  # ================================
  nginx:
    image: nginx:alpine
    container_name: esign-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
      # Uncomment untuk SSL
      # - ./ssl:/etc/nginx/ssl:ro
    networks:
      - esign-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ================================
# Networks
# ================================
networks:
  esign-network:
    driver: bridge

# ================================
# Volumes
# ================================
volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  nginx_logs:
    driver: local
