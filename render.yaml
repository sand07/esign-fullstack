services:
  - type: web
    name: esign-app
    env: node
    region: singapore
    plan: free
    buildCommand: yarn install && npx prisma generate && yarn build
    startCommand: npx prisma migrate deploy && yarn start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /esign
      - key: PORT
        value: 3999
      - key: DATABASE_URL
        fromDatabase:
          name: esign-db
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: SECRET
        generateValue: true

databases:
  - name: esign-db
    databaseName: esign
    user: esign
    plan: free
    ipAllowList: []
